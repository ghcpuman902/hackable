.list div{padding:14px 16px}
.list b{display:block;font-size:16px} .list span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.notes{margin-top:34px;max-width:760px}
.notes h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.notes li{margin:6px 0}
code{font:13px var(--mono);background:var(--surface);padding:1px 5px;border-radius:5px}
