<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirror</title>
<style>
:root{
  --bg:#ffffff; --surface:#f6f6f7; --surface-2:#eeeef0; --line:#e4e4e7;
  --ink:#111113; --muted:#7c7c84; --faint:#a1a1aa;
  --danger:#e5484d; --danger-bg:#feebec; --warn:#f5a524; --warn-bg:#fff4d6;
  --ok:#30a46c; --ok-bg:#e9f9ee; --info:#0b63f6; --info-bg:#e8f0fe;
  --li:#0a66c2; --gh:#1f2328;
  --radius:14px; --radius-sm:10px; --pill:999px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
  --font:Inter,"Inter Fallback",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --n900:#171717; --n800:#262626; --n500:#737373; --n200:#e5e5e5; --n50:#fafafa;
  --amber:#f99c00;
  /* manglekuo.com card: grey fill, white 1px inset highlight (surface-shell-glass), Tailwind v4 shadow-sm outside, 4xl radius */
  --card-bg:#f5f5f5;
  --card-shadow:inset 0 0 0 1px color-mix(in oklch, white 90%, transparent), 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --card-radius:2rem; --sky:#00a5ef; --red:#fb2c36; --emerald:#009767; --violet:#8e51ff; --li-blue:#0a66c2;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{font-size:16px;line-height:1.5}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.mock-nav{position:sticky;top:0;z-index:50;display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:10px 16px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.mock-nav a{text-decoration:none;color:var(--muted)} .mock-nav a:hover{color:var(--ink)}
.mock-nav b{color:var(--ink);font-weight:600}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.brand-mark{width:20px;height:20px;border-radius:6px;background:var(--ink);display:inline-grid;place-items:center}
.brand-mark::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px #fff}
.lede{font-size:clamp(28px,4.6vw,52px);line-height:1.12;letter-spacing:-.025em;font-weight:700;margin:0}
.lede .g{color:var(--muted)}
.ichip{display:inline-flex;align-items:center;gap:.3em;padding:.04em .38em .04em .28em;border-radius:.4em;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.ichip svg,.ichip .ico{width:.8em;height:.8em}
.card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{appearance:none;border:0;border-radius:var(--pill);background:var(--ink);color:#fff;font:600 15px/1 var(--font);padding:14px 22px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:var(--pill);background:var(--surface);color:var(--muted)}
.tag.danger{background:var(--danger-bg);color:#b42318} .tag.warn{background:var(--warn-bg);color:#9a5b00} .tag.ok{background:var(--ok-bg);color:#1a7f4b} .tag.info{background:var(--info-bg);color:#0b4fc4}
.demo-note{font-size:12px;color:var(--faint);text-align:center;padding:24px 16px 40px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== Quintex inline-icon text style (baseline for 01 and 04; from S-quintex/qag/reports/hack-style-brief.md) ===== */
.qx{font-family:var(--font);font-weight:600;font-size:1.375rem;line-height:1.5;letter-spacing:-.025em;text-wrap:pretty;margin:0 0 2.5rem}
@media (min-width:640px){.qx{font-size:1.75rem;line-height:1.45}}
.qx .lead{color:var(--n900)} .qx .rest{color:var(--n500)}
.ico{display:inline-flex;align-items:center;justify-content:center;width:.95em;height:.95em;padding:.16em;border-radius:.25em;vertical-align:.06em;margin-inline:.15em .2em;color:#fff;flex:none;box-sizing:border-box}
.ico svg{width:100%;height:100%;display:block}
.nw{white-space:nowrap;color:var(--n900)}
a.nw{text-decoration:none;border-bottom:2px solid var(--n200)} a.nw:hover{border-color:var(--n900)}
.t-amber{background:var(--amber)} .t-sky{background:var(--sky)} .t-red{background:var(--red)} .t-emerald{background:var(--emerald)}
.t-ink{background:var(--n900)} .t-grey{background:var(--n500)} .t-violet{background:var(--violet)} .t-li{background:var(--li-blue)}
/* pill = icon tile + label, same style */
.pill{display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--n200);background:#fff;padding:6px 12px;font:600 1.0625rem/1.3 var(--font);letter-spacing:-.025em;color:var(--n900)}
.pill:hover{background:var(--n50)}

.mk-card{background:var(--card-bg);box-shadow:var(--card-shadow);border-radius:var(--card-radius)}
/* ---- search field (Google-like shell, Gmail To-field behaviour) holding pills ---- */
.search{margin:0}
.field{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:64px;padding:11px 14px 11px 50px;position:relative;
  border:1px solid var(--n200);border-radius:28px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);cursor:text;transition:box-shadow .15s,border-color .15s}
.field:focus-within{border-color:#d4d4d4;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.09)}
.field .lens{position:absolute;left:18px;top:22px;width:20px;height:20px;color:#a3a3a3}
.field .lens svg{width:100%;height:100%;display:block}
.field input.entry{flex:1 1 160px;min-width:120px;border:0;outline:0;font:600 1.0625rem var(--font);letter-spacing:-.025em;padding:7px 4px;background:transparent;color:var(--n900)}
.field input.entry::placeholder{color:#a3a3a3}
.chip{max-width:100%;padding:5px 6px 5px 10px;gap:2px;user-select:none;cursor:default}
.chip .nw{display:inline-flex;align-items:center;min-width:0}
.chip .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.chip.sel{background:#f5f5f5;border-color:var(--n900);outline:0}
.chip .x{flex:none;width:24px;height:24px;border:0;border-radius:50%;background:transparent;color:#a3a3a3;cursor:pointer;display:grid;place-items:center;padding:0;margin-left:2px}
.chip .x:hover{background:#f0f0f0;color:var(--n900)}
.chip.new{animation:pop .16s ease-out}
.chip.shake{animation:shake .3s}
.chip-edit{height:38px;border:1px solid var(--n900);border-radius:999px;padding:0 14px;font:600 1.0625rem var(--font);letter-spacing:-.025em;outline:0;background:#fff;min-width:80px;color:var(--n900)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.go-btn{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:var(--n900);color:#fff;display:grid;place-items:center;cursor:pointer;padding:12px;transition:background .15s}
.go-btn svg{width:100%;height:100%}
.go-btn:disabled{background:#d4d4d4;cursor:default}

/* ===== 06 landing: only what 05 doesn't already have ===== */
html,body{overflow-x:clip}
body{min-height:100svh;font-size:16px;line-height:1.5}
.app{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:0 20px}
.top{padding-top:clamp(56px,14svh,140px);transition:padding-top .6s cubic-bezier(.2,.8,.2,1)}
h1{font-weight:700;font-size:clamp(34px,5vw,58px);margin-inline:calc(50% - 50vw)!important;padding:0 20px;line-height:1.05;letter-spacing:-.035em;text-align:center;margin:0 0 32px;color:var(--n900);
  transition:opacity .35s, margin .6s cubic-bezier(.2,.8,.2,1), max-height .6s cubic-bezier(.2,.8,.2,1);max-height:3em;overflow:hidden}
body.run .top{padding-top:20px}
body.run h1{opacity:0;max-height:0;margin-bottom:0}
.field{padding-left:18px}
.field input.entry{font-size:1.0625rem}
.ghosts{position:absolute;left:18px;right:64px;top:0;bottom:0;pointer-events:none;overflow:hidden}
.ghosts .row{position:absolute;left:0;top:50%;display:flex;gap:6px;white-space:nowrap;opacity:0;transform:translateY(-10%)}
.ghosts .row.go{animation:drift 2.8s cubic-bezier(.3,.7,.3,1) forwards}
.ghosts .pill{padding:4px 10px;font-size:15px;color:var(--n500);background:#fff}
@keyframes drift{0%{opacity:0;transform:translateY(10%)}20%,70%{opacity:1;transform:translateY(-50%)}100%{opacity:0;transform:translateY(-95%)}}
body.typing .ghosts{display:none}
.under{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:14px}
.people{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;transition:opacity .3s}
.person{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;border:1px solid var(--n200);background:#fff;
  font:600 15px/1 var(--font);letter-spacing:-.02em;color:var(--n900);cursor:pointer}
.person:hover{background:var(--n50)}
.ring{width:32px;height:32px;border-radius:50%;padding:2px;background:var(--ring);flex:none}
.av{width:100%;height:100%;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;background:var(--av)}
body.run .people{display:none}
.report-link{display:none}
body.done .report-link{display:inline-flex;text-decoration:none}
body.done .people{display:none}

/* ---- the scene: a sparse, drifting doodle field ---- */
.stage{position:relative;height:440px;margin-top:4px;overflow:hidden;pointer-events:none;transition:height .6s cubic-bezier(.2,.8,.2,1);
  -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 70%,transparent)}
.glow{position:fixed;left:0;right:0;bottom:0;height:55svh;z-index:0;pointer-events:none;
  background:radial-gradient(60% 80% at 50% 110%,rgba(251,44,54,.13),rgba(251,44,54,.04) 55%,transparent 75%)}
.pc{position:absolute;left:var(--l);top:100%;--op:.7;opacity:0;filter:blur(var(--bl));
  transform:translate(-50%,0) scale(var(--sc));
  animation:rise var(--dur) linear infinite;animation-delay:var(--d);
  transition:left .9s cubic-bezier(.2,.8,.2,1), top .9s cubic-bezier(.2,.8,.2,1), opacity .6s, filter .6s}
.z1{--sc:.84;--bl:.6px} .z1{--op:.45}
.z2{--sc:.68;--bl:1.8px} .z2{--op:.26}
.z0{--sc:1;--bl:0px}
@keyframes rise{
  0%{transform:translate(-50%,0) scale(var(--sc));opacity:0}
  14%{opacity:var(--op)} 72%{opacity:var(--op)}
  92%,100%{transform:translate(-50%,calc(var(--travel) * -1)) scale(var(--sc));opacity:0}}
.art{animation:sway var(--sw) ease-in-out infinite alternate;transform:rotate(var(--r))}
@keyframes sway{from{transform:translateX(-7px) rotate(calc(var(--r) - 3deg))}to{transform:translateX(7px) rotate(calc(var(--r) + 3deg))}}
.ic{display:block;width:38px;height:38px;color:#e5484d}
.ic svg{width:100%;height:100%}
.ic.g{color:#a3a3a3}
.lg{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 6px 18px rgba(160,20,30,.1)}
.lg svg{width:24px;height:24px}
.mc{width:196px;border-radius:16px;padding:11px 12px;background:linear-gradient(180deg,#fff,#fff7f7);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 1px 3px rgba(120,0,0,.08),0 10px 26px rgba(160,20,30,.08);border:1px solid rgba(229,72,77,.14);
  font-size:12px;line-height:1.35;color:var(--n500);letter-spacing:-.01em}
.mc b{color:var(--n900);font-size:13px;display:block}
.mc .hd{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.mc .dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:700;background:var(--c,#a3a3a3)}
.mc .dot svg{width:12px;height:12px}
.mc .url{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:8px;background:#f5f5f5;font-size:11px;color:#525252}
.mc .url svg{width:11px;height:11px;color:#30a46c}
.mc .bar{height:16px;border-radius:6px;background:#f1eaea;margin-top:6px}
.mc .btn2{height:18px;border-radius:6px;background:#e5484d;opacity:.75;margin-top:6px}
.mc .acts{display:flex;gap:8px;margin-top:8px}.mc .acts i{flex:1;height:18px;border-radius:9px;background:#30a46c;opacity:.8}.mc .acts i+i{background:#e5484d}
.mc.sms{width:176px;border-radius:18px 18px 18px 6px;background:#f2f2f4}
/* the same pieces become the check list */
.lrow{display:none}
body.run .stage{height:var(--runh);-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
body.run .pc{--op:.07}
body.run .pc.ck{animation:none;left:var(--sl);top:var(--st);opacity:.4;filter:none;transform:translate(-50%,0) rotate(var(--sr))}
body.run .pc.ck .art{display:none}
body.run .pc.ck .lrow{display:flex}
.lrow{align-items:center;gap:12px;width:272px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--card-bg);box-shadow:var(--card-shadow);transition:box-shadow .4s, background .4s}
.lrow .lg{width:36px;height:36px;border-radius:10px;box-shadow:none;flex:none}
.lrow .lg svg{width:19px;height:19px}
.lrow b{display:block;font-size:15px;letter-spacing:-.02em;color:var(--n900);line-height:1.2}
.lrow .st{display:block;min-height:1.3em;font-size:13px;line-height:1.3;color:var(--n500);white-space:nowrap}
body.run .pc.ck.chk{opacity:1}
body.run .pc.ck.chk .lrow{background:#fff;box-shadow:inset 0 0 0 1px #fff,0 0 0 2px var(--n900),0 10px 26px rgba(0,0,0,.1)}
body.run .pc.ck.chk .st::after{content:"";display:inline-block;width:9px;height:9px;margin-left:6px;border-radius:50%;border:2px solid #d4d4d4;border-top-color:var(--n900);vertical-align:-1px;animation:spin .7s linear infinite}
body.run .pc.ck.ok{opacity:.85}
body.run .pc.ck.bad{opacity:1}
body.run .pc.ck.bad .lrow{background:#fff1f1}
.pc.bad .st{color:#c4262d}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:640px){
  .stage{height:340px}
  .pc.d{display:none}
  .pc{left:var(--ml,var(--l))}
  .mc{width:170px}
  .lrow{width:min(300px,calc(100vw - 48px))}
  h1{margin-bottom:24px}
}
@media (prefers-reduced-motion:reduce){
  .pc{animation:none;top:var(--t);opacity:var(--op)}
  .art{animation:none}
  .ghosts .row.go{animation:none;opacity:1;transform:translateY(-50%)}
  .top,h1,.pc,.stage{transition:none}
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="app">
  <div class="top">
    <h1>See what’s public about you</h1>
    <form class="search" id="form" autocomplete="off" onsubmit="return false">
      <div class="field" id="field" role="group" aria-label="Who to check">
        <div class="ghosts" id="ghosts" aria-hidden="true"></div>
        <input class="entry" id="entry" type="text" spellcheck="false" aria-label="Name, email or link" placeholder="">
        <button type="button" class="go-btn" id="submit" aria-label="Check" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 10h4"/><path d="M19 7V4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v3"/><path d="M20 21a2 2 0 0 0 2-2v-3.851c0-1.39-2-2.962-2-4.829V8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v11a2 2 0 0 0 2 2z"/><path d="M22 16H2"/><path d="M4 21a2 2 0 0 1-2-2v-3.851c0-1.39 2-2.962 2-4.829V8a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v11a2 2 0 0 1-2 2z"/><path d="M9 7V4a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v3"/></svg></button>
      </div>
    </form>
    <div class="under">
      <div class="people" id="people"></div>
      <a class="pill report-link" id="reportlink" href="05-search-flow.html">Open the report</a>
    </div>
  </div>
</div>
<div class="stage" id="stage" aria-live="polite"></div>
<script>
const LUCIDE={"mail": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7\" /> <rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\" /></svg>", "user": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\" /> <circle cx=\"12\" cy=\"7\" r=\"4\" /></svg>", "globe": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20\" /> <path d=\"M2 12h20\" /></svg>", "at-sign": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\" /> <path d=\"M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8\" /></svg>", "phone": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384\" /></svg>", "type": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v16\" /> <path d=\"M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2\" /> <path d=\"M9 20h6\" /></svg>", "search": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\  4H7.24a2 2 0 0 0-1.79 1.11z\" /></svg>", "briefcase": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\" /> <rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\" /></svg>", "code-xml": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m18 16 4-4-4-4\" /> <path d=\"m6 8-4 4 4 4\" /> <path d=\"m14.5 4-5 16\" /></svg>", "terminal": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 19h8\" /> <path d=\"m4 17 6-6-6-6\" /></svg>", "log-out": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m16 17 5-5-5-5\" /> <path d=\"M21 12H9\" /> <path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\" /></svg>", "shield-alert": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\" /> <path d=\"M12 8v4\" /> <path d=\"M12 16h.01\" /></svg>", "lock-keyhole": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"16\" r=\"1\" /> <rect x=\"3\" y=\"10\" width=\"18\" height=\"12\" rx=\"2\" /> <path d=\"M7 10V7a5 5 0 0 1 10 0v3\" /></svg>", "arrow-right": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoi tColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z\" /></svg>"};
const TILE = { // [lucide glyph, tile class]
  email:['mail','t-amber'], linkedin:['linkedin','t-li'], github:['github','t-ink'], x:['twitter','t-ink'],
  url:['globe','t-sky'], handle:['at-sign','t-violet'], phone:['phone','t-emerald'], name:['user','t-ink'], text:['type','t-grey']
};
const ICON = Object.fromEntries(Object.entries(TILE).map(([k,[g,c]])=>[k,'<span class="ico '+c+'">'+LUCIDE[g]+'</span>']));
const KIND_LABEL = {email:'Email',linkedin:'LinkedIn',github:'GitHub',x:'X',url:'Link',handle:'Username',phone:'Phone',name:'Name',text:'Note'};

/* ============ Type detection ============ */
const RE = {
  email:/^[^\s@,;]+@[^\s@,;]+\.[a-z]{2,}$/i,
  url:/^(https?:\/\/)?(www\.)?([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/[^\s]*)?$/i,
  handle:/^@[\w.]{2,30}$/,
  phone:/^\+?[\d][\d\s().-]{6,}$/,
  name:/^[\p{Lu}][\p{L}'’.-]*(\s+[\p{L}'’.-]+){1,3}$/u,
  user:/^[a-z0-9._-]*\d[a-z0-9._-]*$|^[a-z0-9]+[._-][a-z0-9._-]+$/i
};
function detect(raw){
  const v = raw.trim();
  if (RE.email.test(v)) return {kind:'email', label:v.toLowerCase()};
  if (RE.handle.test(v)) return {kind:'handle', label:v};
  if (RE.url.test(v) && !/^\d+(\.\d+)+$/.test(v)) {
    const clean = v.replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/$/,'');
    const host = clean.split('/')[0].toLowerCase();
    const kind = /(^|\.)linkedin\.com$/.test(host) ? 'linkedin' : /(^|\.)github\.com$/.test(host) ? 'github'
               : /(^|\.)(x|twitter)\.com$/.test(host) ? 'x' : 'url';
    return {kind, label:clean};
  }
  if (RE.phone.test(v) && v.replace(/\D/g,'').length >= 7) return {kind:'phone', label:v};
  if (RE.name.test(v)) return {kind:'name', label:v};
  if (!/\s/.test(v) && RE.user.test(v)) return {kind:'handle', label:v};
  return {kind:'text', label:v};
}
const isStrong = w => RE.email.test(w) || RE.handle.test(w) || (RE.url.test(w) && /[./]/.test(w));

/* Split one segment (no commas) into tokens: emails/links stand alone, other words group together.
   "Jane Doe jane@x.com" -> ["Jane Doe","jane@x.com"] */
function explode(segment){
  const out=[]; let buf=[];
  for (const w of segment.trim().split(/\s+/).filter(Boolean)){
    if (isStrong(w)) { if (buf.length) out.push(buf.join(' ')); buf=[]; out.push(w); }
    else buf.push(w);
  }
  if (buf.length) out.push(buf.join(' '));
  return out;
}
const tokenize = text => text.split(/[,;\n]+/).flatMap(explode);

/* ============ Chip store + rendering ============ */
const field = document.getElementById('field'), entry = document.getElementById('entry');
let chips = []; // {id, raw, kind, label}
let uid = 0;
let freshIds = new Set();

function chipEl(c){
  const el = document.createElement('span');
  el.className='chip pill'+(freshIds.has(c.id)?' new':''); el.tabIndex=0; el.dataset.id=c.id; el.dataset.kind=c.kind;
  el.title = KIND_LABEL[c.kind]+': '+c.raw+'  (double-click to edit)';
  el.setAttribute('role','button');
  el.innerHTML = '<span class="nw">'+ICON[c.kind]+'<span class="lbl"></span></span>'+
    '<button type="button" class="x" aria-label="Remove"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3 3 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>';
  el.querySelector('.lbl').textContent = c.label;
  el.addEventListener('dblclick', e => { e.preventDefault(); startEdit(c.id); });
  el.addEventListener('click', e => {
    if (e.target.closest('.x')) { remove(c.id); entry.focus(); return; }
    select(c.id);
  });
  el.addEventListener('keydown', e => {
    if (e.key==='Backspace'||e.key==='Delete'){ e.preventDefault(); remove(c.id); entry.focus(); }
    if (e.key==='Enter'||e.key==='F2'){ e.preventDefault(); startEdit(c.id); }
    if (e.key==='ArrowRight'){ e.preventDefault(); (el.nextElementSibling?.classList.contains('chip')?el.nextElementSibling:entry).focus(); }
    if (e.key==='ArrowLeft'){ e.preventDefault(); el.previousElementSibling?.classList.contains('chip') && el.previousElementSibling.focus(); }
  });
  el.addEventListener('focus', () => select(c.id));
  return el;
}
function render(){
  field.querySelectorAll('.chip,.chip-edit').forEach(n=>n.remove());
  for (const c of chips) field.insertBefore(chipEl(c), entry);
  freshIds.clear();
  entry.placeholder = chips.length ? 'Add more' : '';
  updateSubmit();
}
function makeChips(text){
  return tokenize(text).map(raw => ({id:++uid, raw, ...detect(raw)}));
}
function add(text, at=chips.length){
  const fresh=[];
  for (const c of makeChips(text)){
    const dupe = chips.find(x => x.label.toLowerCase()===c.label.toLowerCase());
    if (dupe){ requestAnimationFrame(()=>{const d=field.querySelector('[data-id="'+dupe.id+'"]'); d&&(d.classList.remove('shake'),void d.offsetWidth,d.classList.add('shake'));}); continue; }
    fresh.push(c);
  }
  fresh.forEach(c=>freshIds.add(c.id));
  chips.splice(at,0,...fresh); render();
}
function remove(id){ chips = chips.filter(c=>c.id!==id); render(); }
function select(id){ field.querySelectorAll('.chip').forEach(n=>n.classList.toggle('sel', n.dataset.id==id)); }
function commit(){ const v=entry.value; entry.value=''; if (v.trim()) add(v); }

/* ============ Editing: double-click turns a chip back into text ============ */
function startEdit(id){
  const i = chips.findIndex(c=>c.id===id); if (i<0) return;
  const c = chips[i], node = field.querySelector('[data-id="'+id+'"]');
  const inp = document.createElement('input');
  inp.className='chip-edit'; inp.value=c.raw; inp.setAttribute('aria-label','Edit '+c.label);
  inp.style.width = Math.max(80, c.raw.length*8.4+28)+'px';
  node.replaceWith(inp); inp.focus(); inp.select();
  let done=false;
  const finish = keep => {
    if (done) return; done=true;
    const v = inp.value;
    chips.splice(i,1);
    if (keep) { if (v.trim()) add(v, i); else render(); } else { chips.splice(i,0,c); render(); }
    entry.focus();
  };
  inp.addEventListener('input', ()=> inp.style.width = Math.max(80, inp.value.length*8.4+28)+'px');
  inp.addEventListener('keydown', e => {
    if (e.key==='Enter'||e.key===','||e.key==='Tab'){ e.preventDefault(); finish(true); }
    if (e.key==='Escape'){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', ()=>finish(true));
}

/* ============ Main entry behaviour (Gmail To-field rules) ============ */
let armed=false; // Backspace on empty: 1st press selects last chip, 2nd deletes
entry.addEventListener('keydown', e => {
  if (e.key==='Enter'){ e.preventDefault(); if (entry.value.trim()) commit(); else if (!submitBtn.disabled) submitBtn.click(); return; }
  if ((e.key===','||e.key===';'||e.key==='Tab') && entry.value.trim()){ e.preventDefault(); commit(); return; }
  if (e.key==='Backspace' && !entry.value && chips.length){
    e.preventDefault();
    const last = chips[chips.length-1];
    if (armed){ remove(last.id); armed=false; } else { select(last.id); armed=true; }
    return;
  }
  if (e.key==='ArrowLeft' && entry.selectionStart===0 && chips.length){ e.preventDefault(); field.querySelector('.chip:last-of-type')?.focus(); }
  armed=false; select(null);
});
entry.addEventListener('input', () => {
  const v = entry.value;
  if (/[,;\n]/.test(v)) {                      // pasted or typed separators
    const parts = v.split(/[,;\n]/); const tail = parts.pop();
    add(parts.join(','));
    entry.value = tail.replace(/^\s+/,'');
  }
  if (/\s$/.test(entry.value)) {                 // space after an email/link/@handle commits it
    const words = entry.value.trim().split(/\s+/);
    if (words.length && isStrong(words[words.length-1])) commit();
  }
});
entry.addEventListener('blur', () => setTimeout(()=>{ if (document.activeElement!==entry && !document.activeElement?.classList.contains('chip-edit')) commit(); }, 0));
field.addEventListener('mousedown', e => { if (e.target===field) { e.preventDefault(); entry.focus(); } });

/* empty state: example combinations drift up inside the box */
const EXAMPLES = ['Jane Doe Smith, jane@example.com','@alexchen, github.com/alexchen','+44 7700 900123, Priya Kapoor','linkedin.com/in/markreynolds, Mark Reynolds','priya.k@example.org, @priyak'];
const ghosts = document.getElementById('ghosts'); let gi = 0, gTimer;
function ghost(){
  const row = document.createElement('div'); row.className='row';
  row.innerHTML = makeChips(EXAMPLES[gi++ % EXAMPLES.length]).map(c=>`<span class="pill"><span class="nw">${ICON[c.kind]}${c.label}</span></span>`).join('');
  ghosts.replaceChildren(row); void row.offsetWidth; row.classList.add('go');
}
function ghostsOn(){ if (gTimer) return; ghost(); gTimer = setInterval(ghost, 2800); }
function ghostsOff(){ clearInterval(gTimer); gTimer = null; ghosts.replaceChildren(); }

const submitBtn = document.getElementById('submit');
function updateSubmit(){
  submitBtn.disabled = document.body.classList.contains('run') || !(chips.length || entry.value.trim());
  const typing = chips.length || entry.value;
  document.body.classList.toggle('typing', !!typing); typing ? ghostsOff() : ghostsOn();

entry.addEventListener('input', updateSubmit);

const stateFromUI = () => ({who:'me', consent:null, chips: chips.map(({raw})=>raw)});
const ORDER = ['hibp','github','linkedin','site','email','dm','sms','instagram'];
function run(){
  timers.forEach(clearTimeout); timers=[];
  document.body.classList.add('run'); document.body.classList.remove('done'); updateSubmit();
  document.getElementById('reportlink').href = '05-search-flow.html?q='+encodeURIComponent(JSON.stringify(stateFromUI()));
  const phone = innerWidth<=640;
  const items = ORDER.map(k=>stage.querySelector(`.pc.ck[data-k="${k}"]`)).filter(n=>n && getComputedStyle(n).display!=='none');
  items.forEach((n,i)=>{
    n.classList.remove('chk','ok','bad');
    n.querySelector('.st').textContent = '';
    const col = phone ? 0 : i%2, rowi = phone ? i : Math.floor(i/2);
    n.style.setProperty('--sl', phone ? '50%' : `calc(50% ${col?'+':'-'} 146px)`);
    n.style.setProperty('--st', (12 + rowi*(phone?66:74) + (col?30:0))+'px');
    n.style.setProperty('--sr', ((i*37)%5-2)*.5+'deg');
  });
  stage.style.setProperty('--runh', (phone ? 40 + items.length*66 : 70 + Math.ceil(items.length/2)*74)+'px');
  const step = 650;
  items.forEach((n,k)=>{
    const R = ROW[n.dataset.k], st = n.querySelector('.st');
    timers.push(setTimeout(()=>{ n.classList.add('chk'); st.textContent=R[2]; }, 900 + k*step));
    timers.push(setTimeout(()=>{ n.classList.remove('chk'); n.classList.add(R[4]?'bad':'ok'); st.textContent=R[3]; }, 900 + k*step + step*1.4));
  });
  timers.push(setTimeout(()=>document.body.classList.add('done'), 900 + items.length*step + step*1.6));
}
submitBtn.addEventListener('click', ()=>{
  commit(); if (!chips.length || submitBtn.disabled) return;
  entry.blur();
  history.pushState(null,'','?q='+encodeURIComponent(JSON.stringify(stateFromUI())));
  run();
});
function restore(){
  const q = new URLSearchParams(location.search).get('q');
  if (!q){ timers.forEach(clearTimeout); document.body.classList.remove('run','done'); chips=[]; render(); return false; }
  try { const s=JSON.parse(q); chips=[]; add((s.chips||[]).join(', ')); run(); return true; } catch(e){ return false; }
}
addEventListener('popstate', restore);
window.__mirror = { get chips(){ return chips.map(c=>({kind:c.kind,label:c.label})); }, detect, tokenize };
if (!restore()) { render(); entry.focus(); }
</script>
